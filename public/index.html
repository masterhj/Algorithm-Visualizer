<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Algorithm Visualizer</title>
<meta name="description" content="Sorting, searching and pathfinding algorithms executed step by step on a 3D plane.">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Lucide glyphs, 24px grid, stroked at --stroke-icon and rendered at 16px. -->
<svg class="sprite" aria-hidden="true">
  <symbol id="i-sort" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
  <symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></symbol>
  <symbol id="i-step" viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20"/><line x1="19" x2="19" y1="4" y2="20"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.8-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/></symbol>
  <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></symbol>
</svg>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"></span>
      <h1>Algorithm Visualizer</h1>
    </div>

    <div class="seg" id="modes" role="tablist" aria-label="Visualizer">
      <button class="seg-item is-on" role="tab" data-mode="sort" aria-selected="true">
        <svg class="icon"><use href="#i-sort"/></svg>Sorting
      </button>
      <button class="seg-item" role="tab" data-mode="search" aria-selected="false">
        <svg class="icon"><use href="#i-search"/></svg>Searching
      </button>
      <button class="seg-item" role="tab" data-mode="path" aria-selected="false">
        <svg class="icon"><use href="#i-route"/></svg>Pathfinding
      </button>
    </div>
  </header>

  <aside class="rail">
    <section class="block">
      <h2 class="label">Algorithm</h2>
      <div class="seg seg-stack" id="deck" role="tablist" aria-label="Algorithm"></div>
    </section>

    <section class="block">
      <h2 class="label">Parameters</h2>
      <div class="field">
        <div class="field-top">
          <label for="size">Array size</label>
          <output class="num" id="sizeOut" for="size">48</output>
        </div>
        <input type="range" id="size" min="8" max="140" value="48">
      </div>
      <div class="field">
        <div class="field-top">
          <label for="speed">Speed</label>
          <output class="num" id="speedOut" for="speed">8</output>
        </div>
        <input type="range" id="speed" min="1" max="10" value="8">
      </div>
    </section>

    <section class="block">
      <h2 class="label">Transport</h2>
      <div class="transport">
        <button class="ibtn ibtn-primary" id="run" aria-label="Run" title="Run  (space)">
          <svg class="icon"><use href="#i-play" id="runIcon"/></svg>
        </button>
        <button class="ibtn" id="step" aria-label="Step" title="Step one operation  (→)">
          <svg class="icon"><use href="#i-step"/></svg>
        </button>
        <button class="ibtn" id="shuffle" aria-label="Shuffle" title="New data  (s)">
          <svg class="icon"><use href="#i-shuffle"/></svg>
        </button>
        <button class="ibtn" id="reset" aria-label="Reset" title="Reset  (r)">
          <svg class="icon"><use href="#i-reset"/></svg>
        </button>
      </div>
    </section>

    <section class="block block-end">
      <h2 class="label">Legend</h2>
      <ul class="legend" id="legend"></ul>
    </section>
  </aside>

  <main class="stage">
    <div class="readout" id="readout"></div>

    <div class="canvas" id="canvas">
      <div class="floor" aria-hidden="true"></div>
      <div class="plane" id="plane">
        <div class="rack" id="rack"></div>
        <div class="grid" id="grid" hidden></div>
      </div>
      <div class="flash" id="flash" role="status" aria-live="polite"></div>
    </div>

    <footer class="brief">
      <p class="blurb" id="blurb"></p>
      <div class="keys">
        <kbd>space</kbd><span>run</span>
        <kbd>&rarr;</kbd><span>step</span>
        <kbd>r</kbd><span>reset</span>
        <kbd>s</kbd><span>shuffle</span>
      </div>
    </footer>
  </main>

</div>

<script src="js/algorithms.js"></script>
<script src="js/app.js"></script>
</body>
</html>
